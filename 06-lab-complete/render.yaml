# Select this Blueprint file in 06-lab-complete/ when creating the service.
# Provision Redis separately and supply its internal URL as REDIS_URL.
services:
  - type: web
    name: day14-production-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DAILY_BUDGET_USD
        value: "1.0"
