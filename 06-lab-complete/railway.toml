# Set the Railway service root directory to /06-lab-complete.
# Set AGENT_API_KEY and REDIS_URL in service variables; never store them here.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
